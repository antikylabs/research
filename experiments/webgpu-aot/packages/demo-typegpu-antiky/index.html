<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>TypeGPU-Antiky AOT — Heavy Sponza</title>
  </head>
  <body>
    <main id="app" class="workload-shell">
      <canvas id="demo" aria-label="TypeGPU-Antiky AOT Sponza workload"></canvas>
      <section class="loading-card" role="status">
        <div class="loading-title"><strong>ANTIKY // STATIC CASCADES</strong><span id="load-percent">0%</span></div>
        <p id="status" class="workload-status">Loading seven immutable shader artifacts…</p>
        <div class="loading-meter"><progress id="load-progress" max="1" value="0"></progress><span>AOT×7</span></div>
        <div class="loading-bits" aria-hidden="true">
          <span data-load-bit></span><span data-load-bit></span><span data-load-bit></span><span data-load-bit></span>
          <span data-load-bit></span><span data-load-bit></span><span data-load-bit></span><span data-load-bit></span>
          <span data-load-bit></span><span data-load-bit></span><span data-load-bit></span><span data-load-bit></span>
          <span data-load-bit></span><span data-load-bit></span><span data-load-bit></span><span data-load-bit></span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
